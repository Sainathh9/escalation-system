server {
    listen 80;
    server_name _;

    # ── Static SPA Files ────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router client-side navigation
    # All unknown paths fall back to index.html (SPA behaviour)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API Proxy ────────────────────────────────────────
    # Proxy /api/* requests to the backend container
    # The browser only talks to this Nginx on port 80 — no CORS issues
    location /api/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Socket.IO WebSocket Proxy ────────────────────────────────
    # Socket.IO requires special upgrade headers for WebSocket handshake
    location /socket.io/ {
        proxy_pass             http://backend:5001;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "no-referrer"  always;

    # ── Cache Static Assets ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;
}
